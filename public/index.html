<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pollería · Tienda online</title>
<style>
  :root{
    --bg:#fbf7f2; --card:#ffffff; --ink:#2a2320; --muted:#8a7d74; --line:#ece3d9;
    --accent:#d1462f; --accent-dark:#b23a26; --green:#2f8f5b; --amber:#b6791f; --wpp:#25d366;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --serif:'Iowan Old Style','Palatino Linotype',Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}

  header{background:linear-gradient(180deg,#fff,#fbf7f2);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{font-family:var(--serif);font-weight:700;font-size:1.3rem}
  .logo .dot{color:var(--accent)}
  .navbtns{display:flex;gap:10px;align-items:center}
  .hero{padding:22px 0 26px;display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-end}
  .hero .info h1{font-family:var(--serif);font-size:1.9rem;margin:0 0 8px}
  .hero .info p{margin:2px 0;color:var(--muted);font-size:.94rem}
  .hero .actions{display:flex;gap:10px;flex-wrap:wrap}

  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer}
  .btn:hover{background:var(--accent-dark)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
  .btn.wpp{background:var(--wpp);color:#053}
  .btn.sm{padding:7px 12px;font-size:.84rem;border-radius:8px}
  .btn:disabled{opacity:.5;cursor:default}

  main{padding:8px 0 60px;display:grid;grid-template-columns:1fr 340px;gap:26px}
  @media(max-width:860px){main{grid-template-columns:1fr}}
  h2.sec{font-family:var(--serif);font-size:1.4rem;margin:10px 0 14px}

  .products{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(max-width:560px){.products{grid-template-columns:1fr}}
  .prod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;display:flex;flex-direction:column;gap:6px}
  .prod h3{margin:0;font-size:1.05rem}
  .prod .price{font-weight:700;font-size:1.15rem}
  .prod .unit{color:var(--muted);font-weight:500;font-size:.85rem}
  .prod .desc{color:var(--muted);font-size:.86rem;flex:1}
  .prod .add{display:flex;gap:8px;align-items:center;margin-top:6px}
  .prod .add input{width:74px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit}
  .prod.off{opacity:.55}
  .prod .pimg{width:100%;height:150px;object-fit:cover;border-radius:10px;margin-bottom:4px;background:#f2ece4}
  .prod .pimg.ph{display:flex;align-items:center;justify-content:center;color:#c9bcae;font-size:2rem}
  .tagoff{font-size:.72rem;color:var(--amber);background:#fdf4e3;border-radius:6px;padding:2px 8px;align-self:flex-start}

  /* Carrito / cuenta */
  aside{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .panel h3{margin:0 0 12px;font-size:.95rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .cart-item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
  .cart-item .x{color:var(--accent);cursor:pointer;border:none;background:none;font-size:1rem}
  .sum-row{display:flex;justify-content:space-between;font-size:.9rem;margin-top:6px}
  .sum-row.promo{color:var(--green);font-weight:600}
  .cart-total{display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .promo-banner{background:#eafaf0;border-color:#c7ecd5;color:#1c6b40;font-weight:600;font-size:.92rem;padding:12px 16px}
  .muted{color:var(--muted)} .empty{color:var(--muted);font-size:.9rem;text-align:center;padding:14px 0}
  label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
  input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:.9rem;background:#fff}
  textarea{resize:vertical;min-height:56px}
  .msg{font-size:.86rem;margin-top:10px;min-height:1.1em}
  .msg.ok{color:var(--green)} .msg.err{color:#c0392b}
  .field-err{color:#c0392b;font-size:.78rem;margin-top:3px;min-height:.9em}

  .orders .order{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:10px;font-size:.86rem}
  .chip{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
  .chip.pendiente{color:var(--amber);background:#fdf4e3}
  .chip.confirmado{color:#2563eb;background:#eef4ff}
  .chip.en_camino{color:#7c3aed;background:#f3ecff}
  .chip.entregado{color:var(--green);background:#eafaf0}
  .chip.cancelado{color:#b91c1c;background:#fdecec}

  /* Modal auth */
  .overlay{position:fixed;inset:0;background:rgba(42,35,32,.45);display:none;align-items:flex-start;justify-content:center;padding:7vh 16px;z-index:30;overflow:auto}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:420px;padding:24px}
  .modal h2{font-family:var(--serif);margin:0 0 4px}
  .modal .tabs2{display:flex;gap:8px;margin:12px 0}
  .modal .tab2{flex:1;text-align:center;padding:8px;border:1px solid var(--line);border-radius:9px;cursor:pointer;color:var(--muted);font-size:.9rem}
  .modal .tab2.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .foothint{color:var(--muted);font-size:.82rem;margin-top:14px;text-align:center}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="bar">
      <div class="logo">Pollería<span class="dot">.</span> <span id="logoName"></span></div>
      <div class="navbtns" id="navAuth">
        <button class="btn ghost sm" onclick="openAuth('login')">Ingresar</button>
        <button class="btn sm" onclick="openAuth('register')">Crear cuenta</button>
      </div>
    </div>
    <div class="hero">
      <div class="info">
        <h1 id="shopName">Pollería</h1>
        <p id="shopAddr"></p>
        <p id="shopHours"></p>
        <p id="shopNotes" class="muted"></p>
      </div>
      <div class="actions">
        <a id="wppBtn" class="btn wpp" target="_blank" rel="noopener">💬 WhatsApp</a>
        <a id="mailBtn" class="btn ghost">✉️ Enviar mail</a>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section>
    <h2 class="sec">Nuestros productos</h2>
    <div class="products" id="products"><p class="empty">Cargando productos…</p></div>
  </section>

  <aside>
    <div class="panel promo-banner" id="promoBanner" style="display:none">
      🎉 <span id="promoText"></span>
    </div>
    <div class="panel">
      <h3>Tu pedido</h3>
      <div id="cartItems"><p class="empty">Todavía no agregaste productos.</p></div>
      <div id="cartSummary" style="display:none">
        <div class="sum-row"><span>Subtotal</span><span id="cartSubtotal">$0</span></div>
        <div class="sum-row promo" id="cartDiscountRow" style="display:none"><span id="cartDiscountLabel">Descuento</span><span id="cartDiscount">-$0</span></div>
        <div class="sum-row" id="cartFaltaRow" style="display:none"><span class="muted" id="cartFalta"></span></div>
        <div class="cart-total"><span>Total</span><span id="cartTotal">$0</span></div>
      </div>
      <div id="checkout" style="display:none">
        <label>Dirección de envío</label>
        <input id="shipAddress" placeholder="Calle, número, localidad">
        <div class="field-err" data-for="shippingAddress"></div>
        <label>Teléfono de contacto</label>
        <input id="shipPhone" placeholder="Para coordinar la entrega">
        <label>Notas (opcional)</label>
        <textarea id="shipNotes" placeholder="Ej: timbre 2, entregar por la tarde"></textarea>
        <button class="btn" style="width:100%;margin-top:12px" id="placeBtn" onclick="placeOrder()">Confirmar pedido</button>
        <div class="msg" id="orderMsg"></div>
        <p class="foothint" id="loginHint" style="display:none">Necesitás <a href="#" onclick="openAuth('login');return false">iniciar sesión</a> para confirmar.</p>
      </div>
    </div>

    <div class="panel orders" id="ordersPanel" style="display:none">
      <h3>Mis pedidos</h3>
      <div id="ordersList"><p class="empty">Sin pedidos todavía.</p></div>
    </div>
  </aside>
</main>

<!-- Modal login/registro -->
<div class="overlay" id="authOverlay">
  <div class="modal">
    <h2 id="authTitle">Ingresar</h2>
    <div class="tabs2">
      <div class="tab2" data-m="login" onclick="setAuthMode('login')">Ingresar</div>
      <div class="tab2" data-m="register" onclick="setAuthMode('register')">Crear cuenta</div>
    </div>
    <div id="regFields" style="display:none">
      <label>Nombre y apellido</label>
      <input id="auName" placeholder="Ej: Juan Pérez"><div class="field-err" data-for="name"></div>
      <label>Teléfono</label>
      <input id="auPhone" type="tel" inputmode="tel" placeholder="Ej: 11 2233-4455"><div class="field-err" data-for="phone"></div>
      <label>Dirección (para envíos)</label>
      <input id="auAddress" placeholder="Calle, número, localidad">
    </div>
    <label>Email</label>
    <input id="auEmail" type="email" inputmode="email" placeholder="nombre@mail.com"><div class="field-err" data-for="email"></div>
    <label>Contraseña</label>
    <input id="auPassword" type="password" placeholder="mín. 8 caracteres con letras y números">
    <div class="field-err" data-for="password"></div>
    <button class="btn" style="width:100%;margin-top:16px" id="authBtn" onclick="submitAuth()">Ingresar</button>
    <div class="msg" id="authMsg"></div>
    <p class="foothint"><a href="#" onclick="closeAuth();return false">Cerrar</a></p>
  </div>
</div>

<script>
  const API = '/api/v1';
  let token = null, me = null, authMode = 'login';
  const cart = []; // { productId, name, unit, price, qty }
  let products = [];
  let promo = { threshold: 15000, rate: 0.10, description: '' };

  // ---------- Carga inicial ----------
  async function init(){
    await Promise.all([loadShop(), loadProducts(), loadPromo()]);
  }
  async function loadPromo(){
    try{
      const { data } = await (await fetch(`${API}/orders/promo`)).json();
      if(data){ promo = data;
        document.getElementById('promoText').textContent = data.description || '';
        document.getElementById('promoBanner').style.display = data.description ? 'block':'none';
      }
    }catch(e){}
  }
  async function loadShop(){
    try{
      const { data:s } = await (await fetch(`${API}/shop`)).json();
      if(!s) return;
      document.getElementById('shopName').textContent = s.name || 'Pollería';
      document.getElementById('logoName').textContent = '';
      document.getElementById('shopAddr').textContent = s.address || '';
      document.getElementById('shopHours').textContent = s.hours || '';
      document.getElementById('shopNotes').textContent = s.notes || '';
      if(s.whatsapp){
        const txt = encodeURIComponent('¡Hola! Quería hacer un pedido.');
        document.getElementById('wppBtn').href = `https://wa.me/${s.whatsapp}?text=${txt}`;
      } else document.getElementById('wppBtn').style.display='none';
      document.getElementById('mailBtn').href = s.email ? `mailto:${s.email}` : '#';
      if(!s.email) document.getElementById('mailBtn').style.display='none';
    }catch(e){}
  }
  async function loadProducts(){
    const box = document.getElementById('products');
    try{
      const { data } = await (await fetch(`${API}/products`)).json();
      products = data || [];
      if(!products.length){ box.innerHTML='<p class="empty">Pronto vamos a cargar productos.</p>'; return; }
      box.innerHTML = products.map(prodHTML).join('');
    }catch(e){ box.innerHTML='<p class="empty">No se pudieron cargar los productos.</p>'; }
  }
  function prodHTML(p){
    const off = !p.available;
    const img = p.image
      ? `<img class="pimg" src="${p.image}" alt="${esc(p.name)}">`
      : `<div class="pimg ph">🍗</div>`;
    return `<div class="prod ${off?'off':''}">
      ${img}
      <h3>${esc(p.name)}</h3>
      <div class="price">${money(p.price)} <span class="unit">/ ${esc(p.unit)}</span></div>
      <div class="desc">${esc(p.description||'')}</div>
      ${off ? '<span class="tagoff">No disponible</span>' :
        `<div class="add">
          <input type="number" min="0.25" step="0.25" value="1" id="qty-${p.id}">
          <button class="btn sm" onclick="addToCart(${p.id})">Agregar</button>
        </div>`}
    </div>`;
  }

  // ---------- Carrito ----------
  function addToCart(id){
    const p = products.find(x=>x.id===id); if(!p) return;
    const qty = Math.max(0.25, Number(document.getElementById('qty-'+id).value)||1);
    const ex = cart.find(c=>c.productId===id);
    if(ex) ex.qty += qty; else cart.push({ productId:id, name:p.name, unit:p.unit, price:p.price, qty });
    renderCart();
  }
  function removeFromCart(id){ const i=cart.findIndex(c=>c.productId===id); if(i>=0) cart.splice(i,1); renderCart(); }
  function renderCart(){
    const box = document.getElementById('cartItems');
    if(!cart.length){
      box.innerHTML='<p class="empty">Todavía no agregaste productos.</p>';
      document.getElementById('cartSummary').style.display='none';
      document.getElementById('checkout').style.display='none';
      return;
    }
    box.innerHTML = cart.map(c=>`<div class="cart-item">
      <span>${esc(c.name)}<br><span class="muted">${c.qty} ${esc(c.unit)} × ${money(c.price)}</span></span>
      <span>${money(c.price*c.qty)} <button class="x" title="Quitar" onclick="removeFromCart(${c.productId})">✕</button></span>
    </div>`).join('');

    // Resumen con la promo (mismo cálculo que hace el servidor).
    const subtotal = cart.reduce((s,c)=>s+c.price*c.qty,0);
    const applies = subtotal >= promo.threshold;
    const discount = applies ? Math.round(subtotal*promo.rate*100)/100 : 0;
    const total = subtotal - discount;
    document.getElementById('cartSubtotal').textContent = money(subtotal);
    document.getElementById('cartTotal').textContent = money(total);
    const discRow = document.getElementById('cartDiscountRow');
    const faltaRow = document.getElementById('cartFaltaRow');
    if(applies){
      discRow.style.display='flex'; faltaRow.style.display='none';
      document.getElementById('cartDiscountLabel').textContent = `Descuento (${Math.round(promo.rate*100)}%)`;
      document.getElementById('cartDiscount').textContent = '-'+money(discount);
    } else {
      discRow.style.display='none';
      faltaRow.style.display='flex';
      document.getElementById('cartFalta').textContent = `Te faltan ${money(promo.threshold - subtotal)} para el ${Math.round(promo.rate*100)}% de descuento`;
    }
    document.getElementById('cartSummary').style.display='block';
    document.getElementById('checkout').style.display='block';
    document.getElementById('loginHint').style.display = token ? 'none' : 'block';
    document.getElementById('placeBtn').textContent = token ? 'Confirmar pedido' : 'Iniciá sesión para confirmar';
  }

  async function placeOrder(){
    clearErrors();
    const msg = document.getElementById('orderMsg'); msg.className='msg';
    // Candado de sesión: si no está logueado, abrimos el login (y el server también lo exige).
    if(!token){ openAuth('login'); return; }
    const payload = {
      items: cart.map(c=>({ productId:c.productId, qty:c.qty })),
      shippingAddress: val('shipAddress'), contactPhone: val('shipPhone'), notes: val('shipNotes'),
    };
    msg.textContent='Enviando pedido…';
    document.getElementById('placeBtn').disabled=true;
    try{
      const res = await fetch(`${API}/orders`, { method:'POST', headers:auth(true), body:JSON.stringify(payload) });
      const data = await res.json().catch(()=>({}));
      if(res.status===201){
        cart.length=0; renderCart();
        const o = data.data;
        const promoTxt = o.promoApplied ? ` (con ${Math.round(promo.rate*100)}% de descuento aplicado 🎉)` : '';
        msg.className='msg ok'; msg.textContent=`¡Pedido #${o.id} recibido! Total ${money(o.total)}${promoTxt}.`;
        loadOrders();
      }else if(res.status===422 && Array.isArray(data.errors)){
        data.errors.forEach(fe=>showErr(fe.field, fe.message));
        msg.className='msg err'; msg.textContent='Revisá los datos del pedido.';
      }else{ msg.className='msg err'; msg.textContent=data.detail||'No se pudo enviar el pedido.'; }
    }catch(e){ msg.className='msg err'; msg.textContent='No se pudo conectar.'; }
    finally{ document.getElementById('placeBtn').disabled=false; }
  }

  // ---------- Auth ----------
  function openAuth(mode){ setAuthMode(mode); document.getElementById('authOverlay').classList.add('open'); }
  function closeAuth(){ document.getElementById('authOverlay').classList.remove('open'); document.getElementById('authMsg').textContent=''; clearErrors(); }
  function setAuthMode(mode){
    authMode = mode;
    document.querySelectorAll('.tab2').forEach(t=>t.classList.toggle('active', t.dataset.m===mode));
    document.getElementById('regFields').style.display = mode==='register' ? 'block':'none';
    document.getElementById('authTitle').textContent = mode==='register' ? 'Crear cuenta' : 'Ingresar';
    document.getElementById('authBtn').textContent = mode==='register' ? 'Crear cuenta' : 'Ingresar';
  }
  // Validación en el navegador antes de enviar (además de la del servidor).
  const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
  function validateRegisterClient(){
    let ok = true;
    const email = val('auEmail'), pw = val('auPassword');
    const name = val('auName'), phone = val('auPhone');
    if(name.length < 2 || !/\p{L}/u.test(name)){ showErr('name','ingresá tu nombre y apellido'); ok=false; }
    if(!EMAIL_RE.test(email)){ showErr('email','ingresá un email válido (ej: nombre@mail.com)'); ok=false; }
    const digits = phone.replace(/[^0-9]/g,'');
    if(!phone){ showErr('phone','ingresá un teléfono de contacto'); ok=false; }
    else if(!/^[0-9()+\s-]+$/.test(phone)){ showErr('phone','usá solo números y + ( ) - espacios'); ok=false; }
    else if(digits.length < 8 || digits.length > 15){ showErr('phone','entre 8 y 15 dígitos (ej: 11 2233-4455)'); ok=false; }
    if(pw.length < 8 || !/[A-Za-z]/.test(pw) || !/[0-9]/.test(pw)){ showErr('password','mín. 8 caracteres, con letras y números'); ok=false; }
    return ok;
  }

  async function submitAuth(){
    clearErrors();
    const msg = document.getElementById('authMsg'); msg.className='msg';
    if(authMode==='register' && !validateRegisterClient()){ msg.className='msg err'; msg.textContent='Revisá los campos marcados.'; return; }
    msg.textContent='Procesando…';
    const body = { email: val('auEmail'), password: val('auPassword') };
    let url = `${API}/auth/login`;
    if(authMode==='register'){
      url = `${API}/auth/register`;
      body.name = val('auName'); body.phone = val('auPhone'); body.address = val('auAddress');
    }
    try{
      const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      const data = await res.json().catch(()=>({}));
      if((res.status===200||res.status===201) && data.accessToken){
        token = data.accessToken; me = data.user; onLogged();
        closeAuth();
      }else if(res.status===422 && Array.isArray(data.errors)){
        data.errors.forEach(fe=>showErr(fe.field, fe.message)); msg.className='msg err'; msg.textContent='Revisá los campos.';
      }else if(res.status===401){ msg.className='msg err'; msg.textContent='Email o contraseña incorrectos.'; }
      else if(res.status===409){ msg.className='msg err'; msg.textContent='Ya existe una cuenta con ese email.'; }
      else{ msg.className='msg err'; msg.textContent=data.detail||'No se pudo completar.'; }
    }catch(e){ msg.className='msg err'; msg.textContent='No se pudo conectar.'; }
  }
  function onLogged(){
    document.getElementById('navAuth').innerHTML =
      `<span class="muted" style="font-size:.9rem">Hola, ${esc(me.name||me.email)}</span>
       <button class="btn ghost sm" onclick="logout()">Salir</button>`;
    if(me.role==='admin'){
      document.getElementById('navAuth').insertAdjacentHTML('afterbegin',
        '<a class="btn ghost sm" href="/admin.html">Panel admin</a>');
    }
    // Prefill dirección de envío con la del perfil
    if(me && !val('shipAddress')) loadProfileIntoCheckout();
    document.getElementById('ordersPanel').style.display='block';
    renderCart(); loadOrders();
  }
  async function loadProfileIntoCheckout(){
    try{ const { data } = await (await fetch(`${API}/auth/me`, {headers:auth()})).json();
      if(data){ if(data.address) document.getElementById('shipAddress').value=data.address;
        if(data.phone) document.getElementById('shipPhone').value=data.phone; }
    }catch(e){}
  }
  function logout(){
    token=null; me=null;
    document.getElementById('navAuth').innerHTML =
      `<button class="btn ghost sm" onclick="openAuth('login')">Ingresar</button>
       <button class="btn sm" onclick="openAuth('register')">Crear cuenta</button>`;
    document.getElementById('ordersPanel').style.display='none';
    renderCart();
  }

  async function loadOrders(){
    if(!token) return;
    const box = document.getElementById('ordersList');
    try{
      const { data } = await (await fetch(`${API}/orders?pageSize=20`, {headers:auth()})).json();
      if(!data || !data.length){ box.innerHTML='<p class="empty">Sin pedidos todavía.</p>'; return; }
      box.innerHTML = data.map(o=>`<div class="order">
        <div style="display:flex;justify-content:space-between">
          <strong>Pedido #${o.id}</strong>
          <span class="chip ${o.status}">${o.status.replace('_',' ')}</span>
        </div>
        <div class="muted">${o.items.map(i=>`${i.qty} ${esc(i.unit)} ${esc(i.name)}`).join(', ')}</div>
        <div style="margin-top:4px"><strong>${money(o.total)}</strong>${o.discount>0?` <span style="color:var(--green);font-size:.82rem">(${money(o.discount)} off)</span>`:''} · ${esc(o.shippingAddress)}</div>
      </div>`).join('');
    }catch(e){ box.innerHTML='<p class="empty">No se pudieron cargar los pedidos.</p>'; }
  }

  // ---------- utils ----------
  function auth(json){ const h = token?{'Authorization':'Bearer '+token}:{}; if(json) h['Content-Type']='application/json'; return h; }
  function val(id){ return document.getElementById(id).value.trim(); }
  function money(n){ return '$' + Number(n||0).toLocaleString('es-AR'); }
  function showErr(f,m){ const el=document.querySelector(`.field-err[data-for="${f}"]`); if(el) el.textContent=m; }
  function clearErrors(){ document.querySelectorAll('.field-err').forEach(e=>e.textContent=''); }
  function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  init();
</script>
</body>
</html>
