# Render blueprint (poultry shop). New + -> Blueprint -> connect this repo.
# Note: the free plan has no persistent disk; the SQLite database resets on
# every cold start. For permanent data: paid disk or PostgreSQL.
services:
  - type: web
    name: polleria-online
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
